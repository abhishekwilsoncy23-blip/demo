<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.I.A Verified Poll</title>
  <!-- styles omitted for brevity, same as before -->
</head>
<body>
<div class="poll-card">
  <div id="auth-view">
    <div class="loader"></div>
    <p style="text-align:center; color:#888; margin-top:15px;">Establishing Secure Link...</p>
    <button onclick="verifyAccount()" class="verify-btn">VERIFY @JECC ACCOUNT</button>
  </div>
  <div id="poll-view" class="hidden">
    <h1>SECURE POLL</h1>
    <div id="total-votes" class="stats">0 RESPONSES</div>
    <p id="question" style="text-align:center; font-weight:500;"></p>
    <div id="options-box"></div>
    <div id="msg"></div>
    <p onclick="verifyAccount()" style="text-align:center; font-size:11px; color:#3498db; cursor:pointer; margin-top:20px; text-decoration:underline;">Switch Account</p>
  </div>
</div>

<script>
  const BASE_URL   = "https://script.google.com/a/macros/jecc.ac.in/s/AKfycbykNHYZ-r2yE8LC5rutEnDOLDRAH0N_1t1NF6KqTEAC3fVAvQHpQTC855m4UFSIUgJz/exec";
  const DATA_URL   = BASE_URL;               // JSONP + POST
  const VERIFY_URL = BASE_URL + "?auth=true"; // Verification popup

  function verifyAccount() {
    const win = window.open(VERIFY_URL, "Auth", "width=500,height=500");
    const timer = setInterval(() => {
      if (win.closed) {
        clearInterval(timer);
        location.reload();
      }
    }, 500);
  }

  window.renderPoll = function(data) {
    const { config, totals, totalVotes } = data;
    document.getElementById('question').innerText = config["Poll Question"];
    document.getElementById('total-votes').innerText = `${totalVotes} TOTAL RESPONSES`;

    const container = document.getElementById('options-box');
    container.innerHTML = "";
    const hasVoted = localStorage.getItem('voted_verified') === 'true';

    Object.keys(config).forEach(key => {
      if(key.toLowerCase().includes("option")) {
        const label = config[key];
        const count = totals[label] || 0;
        const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
        container.innerHTML += `
          <div class="option-item">
            <div class="label-row"><span>${label}</span><span>${pct}%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
            <button class="vote-btn" ${hasVoted ? 'disabled' : ''} onclick="castVote('${label}')">
              ${hasVoted ? 'Registered' : 'Cast Vote'}
            </button>
          </div>
        `;
      }
    });

    document.getElementById('auth-view').classList.add('hidden');
    document.getElementById('poll-view').classList.remove('hidden');
  };

  function init() {
    const script = document.createElement('script');
    script.src = `${DATA_URL}?callback=renderPoll`;
    document.body.appendChild(script);
    script.onerror = () => { console.log("User must verify account first."); };
  }

  async function castVote(choice) {
    const msg = document.getElementById('msg');
    msg.innerText = "Saving vote...";
    document.querySelectorAll('.vote-btn').forEach(b => b.disabled = true);
    const params = new URLSearchParams();
    params.append('Choice', choice);
    try {
      await fetch(DATA_URL, { method: 'POST', body: params, mode: 'no-cors' });
      localStorage.setItem('voted_verified', 'true');
      msg.innerText = "✓ Success! Updating...";
      setTimeout(() => location.reload(), 1500);
    } catch (e) {
      localStorage.setItem('voted_verified', 'true');
      location.reload();
    }
  }

  init();
</script>
</body>
</html>
