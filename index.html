<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.A Verified Poll</title>
    <style>
        :root { --gold: #d4af37; --bg: #0b0b0b; --card: #161616; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .poll-card { background: var(--card); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #222; text-align: center; }
        .bar-bg { background: #222; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .bar-fill { background: var(--gold); height: 100%; width: 0%; transition: width 1s; }
        .vote-btn { width: 100%; padding: 12px; margin-top: 5px; background: transparent; border: 1px solid #444; color: #fff; border-radius: 8px; cursor: pointer; }
        .vote-btn:hover { background: var(--gold); color: #000; }
        .hidden { display: none; }
        .auth-btn { background: var(--gold); color: #000; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
    </style>
</head>
<body>

<div class="poll-card">
    <div id="auth-ui">
        <h2 style="color:var(--gold)">Authentication Required</h2>
        <p style="font-size: 14px; color: #888;">To ensure a fair vote, please verify your @jecc.ac.in account.</p>
        <button onclick="openAuth()" class="auth-btn">VERIFY ACCOUNT</button>
    </div>

    <div id="poll-ui" class="hidden">
        <h1 id="title" style="color:var(--gold)">LIVE POLL</h1>
        <p id="question"></p>
        <div id="options"></div>
        <div id="msg" style="margin-top:20px; font-weight:bold;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/a/macros/jecc.ac.in/s/AKfycbykNHYZ-r2yE8LC5rutEnDOLDRAH0N_1t1NF6KqTEAC3fVAvQHpQTC855m4UFSIUgJz/exec";

    function openAuth() {
        const win = window.open(SCRIPT_URL, "Auth", "width=500,height=600");
        const timer = setInterval(() => {
            if (win.closed) {
                clearInterval(timer);
                location.reload();
            }
        }, 500);
    }

    // This is the JSONP Callback function
    window.handlePollData = function(data) {
        const { config, totals, totalVotes } = data;
        document.getElementById('question').innerText = config["Poll Question"];
        
        const container = document.getElementById('options');
        const hasVoted = localStorage.getItem('voted_verified') === 'true';

        Object.keys(config).forEach(key => {
            if(key.toLowerCase().includes("option")) {
                const label = config[key];
                const count = totals[label] || 0;
                const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

                container.innerHTML += `
                    <div style="margin-bottom:20px; text-align:left;">
                        <div style="display:flex; justify-content:space-between; font-size:13px;">
                            <span>${label}</span><span>${pct}%</span>
                        </div>
                        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
                        <button class="vote-btn" ${hasVoted ? 'disabled' : ''} onclick="castVote('${label}')">
                            ${hasVoted ? 'Registered' : 'Vote'}
                        </button>
                    </div>
                `;
            }
        });

        document.getElementById('auth-ui').classList.add('hidden');
        document.getElementById('poll-ui').classList.remove('hidden');
    };

    // Trigger JSONP Request
    function init() {
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?callback=handlePollData`;
        document.body.appendChild(script);
        
        // Error handling for blocked scripts
        script.onerror = () => {
            console.log("Waiting for user login...");
        };
    }

    async function castVote(choice) {
        const params = new URLSearchParams();
        params.append('Choice', choice);
        
        // POSTs don't return data, so no-cors is fine here
        await fetch(SCRIPT_URL, { method: 'POST', body: params, mode: 'no-cors' });
        
        localStorage.setItem('voted_verified', 'true');
        location.reload();
    }

    init();
</script>
</body>
</html>
