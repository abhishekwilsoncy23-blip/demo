<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.A Real-Time Poll</title>
    <style>
        :root { --primary: #d4af37; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .poll-card { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid #333; }
        
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .vote-count { text-align: center; color: #666; font-size: 12px; margin-bottom: 25px; }
        
        .option-container { margin-bottom: 20px; }
        .option-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        
        .progress-bar { background: #333; height: 12px; border-radius: 6px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 1s ease-out; }
        
        .poll-btn { 
            width: 100%; padding: 12px; margin-top: 5px; background: transparent; 
            border: 1px solid #444; color: white; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .poll-btn:hover:not(:disabled) { background: var(--primary); color: black; border-color: var(--primary); }
        .poll-btn:disabled { opacity: 0.3; cursor: default; }

        #status { margin-top: 20px; text-align: center; font-weight: bold; font-size: 14px; color: var(--primary); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="poll-card">
    <div id="loader">Processing...</div>
    
    <div id="poll-content" class="hidden">
        <h1>LIVE POLL</h1>
        <div id="total-display" class="vote-count">0 VOTES RECORDED</div>
        <div id="options-list"></div>
        <div id="status"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "YOUR_SCRIPT_URL_HERE";

    async function loadPoll() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            const { config, totals, totalVotes } = data;

            document.getElementById('total-display').innerText = `${totalVotes} TOTAL VOTES`;
            const container = document.getElementById('options-list');
            container.innerHTML = '';

            const hasVoted = localStorage.getItem('voted_jecc') === 'true';

            Object.keys(config).forEach(key => {
                if(key.toLowerCase().startsWith("option")) {
                    const choice = config[key];
                    const count = totals[choice] || 0;
                    const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

                    const html = `
                        <div class="option-container">
                            <div class="option-info">
                                <span>${choice}</span>
                                <span>${count} (${percent}%)</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percent}%"></div>
                            </div>
                            <button class="poll-btn" ${hasVoted ? 'disabled' : ''} onclick="castVote('${choice}')">
                                ${hasVoted ? 'Voted' : 'Select'}
                            </button>
                        </div>
                    `;
                    container.innerHTML += html;
                }
            });

            document.getElementById('loader').classList.add('hidden');
            document.getElementById('poll-content').classList.remove('hidden');
        } catch (e) {
            document.getElementById('loader').innerText = "Access Denied. Use JECC account.";
        }
    }

    async function castVote(choice) {
        const status = document.getElementById('status');
        document.querySelectorAll('.poll-btn').forEach(b => b.disabled = true);
        status.innerText = "Submitting to S.I.A...";

        try {
            const formData = new URLSearchParams();
            formData.append('Choice', choice);

            // POST to script
            await fetch(SCRIPT_URL, { method: 'POST', body: formData });

            localStorage.setItem('voted_jecc', 'true');
            status.innerText = "✓ Success! Refreshing...";
            setTimeout(() => location.reload(), 1500);
        } catch (e) {
            status.innerText = "Error submitting vote.";
        }
    }

    loadPoll();
</script>
</body>
</html>
